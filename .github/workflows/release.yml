name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            lib: target/release/libpetgraph_ext.so
          - os: macos-latest
            name: osx-arm64
            lib: target/release/libpetgraph_ext.dylib
          - os: windows-latest
            name: windows-x86_64
            lib: target/release/petgraph_ext.dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Generate extension
        shell: bash
        run: |
          python3 scripts/metadata.py \
            --extension-version "${{ steps.version.outputs.VERSION }}" \
            ${{ matrix.lib }} \
            -o petgraph_ext.duckdb_extension

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: petgraph_ext.duckdb_extension
