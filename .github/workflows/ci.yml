name: Build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: python3 scripts/metadata.py target/release/libpetgraph_ext.so -o petgraph_ext.duckdb_extension
      - uses: actions/upload-artifact@v4
        with:
          name: petgraph_ext-linux-x86_64
          path: petgraph_ext.duckdb_extension

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: python3 scripts/metadata.py target/release/libpetgraph_ext.dylib -o petgraph_ext.duckdb_extension
      - uses: actions/upload-artifact@v4
        with:
          name: petgraph_ext-macos-arm64
          path: petgraph_ext.duckdb_extension
