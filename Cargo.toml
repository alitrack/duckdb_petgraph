[package]
name = "duckdb_petgraph"
version = "0.5.0"
edition = "2021"
description = "DuckDB extension for graph algorithms using petgraph"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_petgraph"

[lib]
name = "petgraph_ext"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
name = "duckdb_petgraph"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
quack-rs = "0.14"
libduckdb-sys = "1.10504"
petgraph = "0.7"
