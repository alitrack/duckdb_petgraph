[package]
name = "duckdb_petgraph"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension for graph algorithms using petgraph"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_petgraph"

[lib]
name = "petgraph_ext"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
name = "duckdb_petgraph"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10504.0", features = ["loadable-extension", "vscalar"] }
petgraph = "0.7"
arrow = "58"
